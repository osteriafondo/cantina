<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Ordini Cucina — Osteria Fondo</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="shortcut icon" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ordini OF"/>
<meta name="theme-color" content="#1A1714"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E2DDD6;
    --text: #1A1714;
    --muted: #7A756E;
    --hint: #B0AAA2;
    --red: #C0392B;
    --red-bg: #FDF0EE;
    --green: #2E7D32;
    --green-bg: #F0F7F0;
    --amber: #9C6A00;
    --amber-bg: #FFF8EC;
    --accent: #7B1C2E;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  header {
    background: var(--text);
    color: #F7F5F0;
    padding: 0.85rem 1.1rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .title { display: flex; flex-direction: column; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { font-size: 11px; opacity: 0.55; margin-top: 2px; }
  header button.reset {
    background: transparent; border: 1px solid rgba(247,245,240,0.25);
    color: #F7F5F0; font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm);
    cursor: pointer;
  }
  header button.reset:active { background: rgba(247,245,240,0.1); }

  .search-wrap {
    position: sticky; top: 0; z-index: 90;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 1rem;
  }
  .search-wrap input {
    width: 100%; border: 1px solid var(--border); background: var(--bg);
    border-radius: var(--radius-sm); padding: 11px 12px; font-size: 15px; color: var(--text);
  }
  .search-wrap input:focus { outline: none; border-color: var(--text); background: var(--surface); }

  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 1rem;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; z-index: 89;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--text); color: #F7F5F0; border-color: var(--text); }
  .chip .n { opacity: 0.6; margin-left: 4px; }

  main { padding: 0 0 120px; }

  .cat {
    scroll-margin-top: 120px;
  }
  .cat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 1rem 6px; position: sticky; z-index: 50;
    background: var(--bg);
  }
  .cat-head h2 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent);
  }
  .cat-head .count { font-size: 11px; color: var(--hint); font-weight: 600; }
  .cat-head .line { flex: 1; height: 1px; background: var(--border); }

  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; margin: 6px 1rem;
  }
  .row.active { border-color: var(--accent); background: #FCF7F3; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .meta { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row .sup { color: var(--hint); }
  .row .sup::before { content: "· "; }

  .stepper { display: flex; align-items: center; gap: 0; flex: 0 0 auto; }
  .stepper button {
    width: 34px; height: 38px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper button:active { background: var(--border); }
  .stepper button.minus { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stepper button.plus { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stepper input {
    width: 52px; height: 38px; text-align: center; border: 1px solid var(--border);
    border-left: 0; border-right: 0; font-size: 16px; font-weight: 600; color: var(--text);
    background: var(--surface); -moz-appearance: textfield; padding: 0;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: none; }
  .stepper.filled input { color: var(--accent); }
  .stepper .unit {
    font-size: 11px; color: var(--muted); align-self: center; padding-left: 8px;
    min-width: 26px; text-align: left;
  }

  .empty { text-align: center; color: var(--hint); padding: 40px 1rem; font-size: 14px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 110;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 1rem; padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
  }
  .bar .summary { flex: 1; font-size: 13px; color: var(--muted); }
  .bar .summary b { color: var(--text); font-size: 15px; }
  .bar button.generate {
    background: var(--accent); color: #fff; border: 0; border-radius: var(--radius);
    padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .bar button.generate:disabled { background: var(--border); color: var(--hint); cursor: default; }
  .bar button.generate:active:not(:disabled) { opacity: 0.9; }

  /* Sheet ordini */
  .overlay {
    position: fixed; inset: 0; z-index: 200; background: rgba(26,23,20,0.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 1rem 12px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .sheet-head h2 { font-size: 16px; font-weight: 700; }
  .sheet-head .close { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; }
  .sheet-body { overflow-y: auto; padding: 12px 1rem 24px; }

  .order-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .order-card .oc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px; background: #FCF7F3; border-bottom: 1px solid var(--border);
  }
  .order-card .oc-head .name { font-weight: 700; font-size: 14px; color: var(--accent); }
  .order-card .oc-head .n { font-size: 11px; color: var(--muted); }
  .order-card textarea {
    width: 100%; border: 0; resize: vertical; min-height: 130px; padding: 12px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.55;
    color: var(--text); background: var(--surface);
  }
  .order-card textarea:focus { outline: none; }
  .order-card .oc-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .order-card .oc-actions button {
    flex: 1; padding: 11px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
  }
  .btn-copy { background: var(--text); color: #fff; border-color: var(--text) !important; }
  .btn-copy.done { background: var(--green); border-color: var(--green) !important; }
  .btn-wa { background: #25D366; color: #fff; border-color: #25D366 !important; }
  .btn-copy:active, .btn-wa:active { opacity: 0.9; }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Ordini Cucina</h1>
    <span class="sub">Osteria Fondo</span>
  </div>
  <button class="reset" onclick="nuovaSerata()">Nuova serata</button>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Cerca prodotto…" autocomplete="off"
    oninput="state.q=this.value; render()" />
</div>

<div class="chips" id="chips"></div>

<main id="list"></main>

<div class="bar">
  <div class="summary" id="summary"><b>0</b> prodotti da ordinare</div>
  <button class="generate" id="genBtn" onclick="apriOrdini()" disabled>Genera ordini</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Ordini da inviare</h2>
      <button class="close" onclick="chiudiOrdini()">&times;</button>
    </div>
    <div class="sheet-body" id="orders"></div>
  </div>
</div>

<script>
/* ============================================================
   CATALOGO PRODOTTI  —  DATI DI ESEMPIO (da sostituire)
   Ogni prodotto: { nome, cat, unita, fornitore }
     cat       -> una delle CATEGORIE qui sotto
     unita     -> unità di misura mostrata a fianco (kg, pz, cassa, L…)
     fornitore -> con chi si ordina (usato per dividere i messaggi)
   ============================================================ */
const CATEGORIE = ["latticini", "frutta e verdura", "carne", "no food", "generici"];

const CATALOGO = [
  // --- LATTICINI ---
  { nome: "Latte intero",            cat: "latticini",        unita: "L",     fornitore: "Caseificio Rossi" },
  { nome: "Panna fresca",            cat: "latticini",        unita: "L",     fornitore: "Caseificio Rossi" },
  { nome: "Burro",                   cat: "latticini",        unita: "kg",    fornitore: "Caseificio Rossi" },
  { nome: "Parmigiano Reggiano",     cat: "latticini",        unita: "kg",    fornitore: "Caseificio Rossi" },
  { nome: "Mozzarella fiordilatte",  cat: "latticini",        unita: "kg",    fornitore: "Caseificio Rossi" },
  { nome: "Ricotta",                 cat: "latticini",        unita: "kg",    fornitore: "Caseificio Rossi" },
  { nome: "Uova",                    cat: "latticini",        unita: "pz",    fornitore: "Caseificio Rossi" },

  // --- FRUTTA E VERDURA ---
  { nome: "Pomodori ramati",         cat: "frutta e verdura", unita: "kg",    fornitore: "Ortofrutta Verdi" },
  { nome: "Insalata mista",          cat: "frutta e verdura", unita: "cassa", fornitore: "Ortofrutta Verdi" },
  { nome: "Patate",                  cat: "frutta e verdura", unita: "kg",    fornitore: "Ortofrutta Verdi" },
  { nome: "Cipolle dorate",          cat: "frutta e verdura", unita: "kg",    fornitore: "Ortofrutta Verdi" },
  { nome: "Zucchine",                cat: "frutta e verdura", unita: "kg",    fornitore: "Ortofrutta Verdi" },
  { nome: "Limoni",                  cat: "frutta e verdura", unita: "kg",    fornitore: "Ortofrutta Verdi" },
  { nome: "Basilico",                cat: "frutta e verdura", unita: "pz",    fornitore: "Ortofrutta Verdi" },

  // --- CARNE ---
  { nome: "Manzo (macinato)",        cat: "carne",            unita: "kg",    fornitore: "Macelleria Bianchi" },
  { nome: "Guanciale",               cat: "carne",            unita: "kg",    fornitore: "Macelleria Bianchi" },
  { nome: "Petto di pollo",          cat: "carne",            unita: "kg",    fornitore: "Macelleria Bianchi" },
  { nome: "Salsiccia",               cat: "carne",            unita: "kg",    fornitore: "Macelleria Bianchi" },
  { nome: "Prosciutto crudo",        cat: "carne",            unita: "kg",    fornitore: "Salumeria Neri" },

  // --- NO FOOD ---
  { nome: "Tovaglioli carta",        cat: "no food",          unita: "conf",  fornitore: "Forniture Max" },
  { nome: "Carta forno",            cat: "no food",          unita: "rotolo",fornitore: "Forniture Max" },
  { nome: "Guanti monouso",          cat: "no food",          unita: "conf",  fornitore: "Forniture Max" },
  { nome: "Detersivo piatti",        cat: "no food",          unita: "L",     fornitore: "Forniture Max" },
  { nome: "Sacchi spazzatura",       cat: "no food",          unita: "conf",  fornitore: "Forniture Max" },

  // --- GENERICI ---
  { nome: "Farina 00",               cat: "generici",         unita: "kg",    fornitore: "Alimentari Grossi" },
  { nome: "Olio EVO",                cat: "generici",         unita: "L",     fornitore: "Alimentari Grossi" },
  { nome: "Sale fino",               cat: "generici",         unita: "kg",    fornitore: "Alimentari Grossi" },
  { nome: "Pasta secca",             cat: "generici",         unita: "kg",    fornitore: "Alimentari Grossi" },
  { nome: "Passata di pomodoro",     cat: "generici",         unita: "pz",    fornitore: "Alimentari Grossi" },
  { nome: "Zucchero",                cat: "generici",         unita: "kg",    fornitore: "Alimentari Grossi" },
];

/* Nome ristorante usato nell'intestazione dei messaggi */
const RISTORANTE = "Osteria Fondo";
const STORAGE_KEY = "of_ordini_cucina_v1";

/* ============================================================ */

// id stabile per prodotto (indice nel catalogo)
CATALOGO.forEach((p, i) => p.id = i);

const state = {
  q: "",
  cat: "tutte",
  qty: {},        // id -> quantità (numero)
};

// carica quantità salvate
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  if (saved && typeof saved === "object") state.qty = saved.qty || {};
} catch (e) {}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ qty: state.qty })); } catch (e) {}
}

function getQty(id) { return state.qty[id] || 0; }
function setQty(id, val) {
  val = Math.max(0, Math.round(val * 100) / 100);
  if (val === 0) delete state.qty[id]; else state.qty[id] = val;
  persist();
  updateRow(id);
  updateSummary();
}
function bump(id, delta) { setQty(id, getQty(id) + delta); }

function matchesSearch(p) {
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return p.nome.toLowerCase().includes(q) || (p.fornitore || "").toLowerCase().includes(q);
}

function visibleCats() {
  // categorie nell'ordine definito, solo quelle presenti nel catalogo
  return CATEGORIE.filter(c => CATALOGO.some(p => p.cat === c));
}

function renderChips() {
  const chips = document.getElementById("chips");
  const cats = visibleCats();
  const parts = [`<button class="chip ${state.cat==='tutte'?'on':''}" onclick="setCat('tutte')">Tutte</button>`];
  cats.forEach(c => {
    const n = CATALOGO.filter(p => p.cat === c && getQty(p.id) > 0).length;
    parts.push(`<button class="chip ${state.cat===c?'on':''}" onclick="setCat('${c}')">${cap(c)}${n?`<span class="n">${n}</span>`:''}</button>`);
  });
  chips.innerHTML = parts.join("");
}

function setCat(c) {
  state.cat = c;
  render();
  if (c !== "tutte") {
    const el = document.getElementById("cat-" + slug(c));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function render() {
  renderChips();
  const list = document.getElementById("list");
  const cats = visibleCats().filter(c => state.cat === "tutte" || state.cat === c);
  let html = "";
  let anyVisible = false;

  cats.forEach(c => {
    const prods = CATALOGO.filter(p => p.cat === c && matchesSearch(p));
    if (!prods.length) return;
    anyVisible = true;
    const nSel = prods.filter(p => getQty(p.id) > 0).length;
    html += `<section class="cat" id="cat-${slug(c)}">
      <div class="cat-head">
        <h2>${cap(c)}</h2>
        ${nSel?`<span class="count">${nSel} da ordinare</span>`:''}
        <span class="line"></span>
      </div>`;
    prods.forEach(p => html += rowHTML(p));
    html += `</section>`;
  });

  list.innerHTML = anyVisible ? html : `<div class="empty">Nessun prodotto trovato.</div>`;
  updateSummary();
}

function rowHTML(p) {
  const q = getQty(p.id);
  return `<div class="row ${q>0?'active':''}" id="row-${p.id}">
    <div class="info">
      <div class="name">${esc(p.nome)}</div>
      <div class="meta">${esc(p.unita)}<span class="sup">${esc(p.fornitore||'—')}</span></div>
    </div>
    <div class="stepper ${q>0?'filled':''}">
      <button class="minus" onclick="bump(${p.id},-1)" aria-label="meno">−</button>
      <input type="number" inputmode="decimal" min="0" step="1" value="${q||''}" placeholder="0"
        onchange="setQty(${p.id}, parseFloat(this.value)||0)"
        onfocus="this.select()" />
      <button class="plus" onclick="bump(${p.id},1)" aria-label="più">+</button>
      <span class="unit">${esc(p.unita)}</span>
    </div>
  </div>`;
}

function updateRow(id) {
  const row = document.getElementById("row-" + id);
  if (!row) return;
  const q = getQty(id);
  row.classList.toggle("active", q > 0);
  const stepper = row.querySelector(".stepper");
  stepper.classList.toggle("filled", q > 0);
  const input = stepper.querySelector("input");
  if (document.activeElement !== input) input.value = q || "";
  renderChips();
  // aggiorna contatore categoria
  const p = CATALOGO[id];
  const sec = document.getElementById("cat-" + slug(p.cat));
  if (sec) {
    const prods = CATALOGO.filter(x => x.cat === p.cat && matchesSearch(x));
    const nSel = prods.filter(x => getQty(x.id) > 0).length;
    const badge = sec.querySelector(".cat-head .count");
    if (badge) badge.textContent = nSel ? `${nSel} da ordinare` : "";
    else if (nSel) {
      const h = sec.querySelector(".cat-head h2");
      h.insertAdjacentHTML("afterend", `<span class="count">${nSel} da ordinare</span>`);
    }
  }
}

function selectedItems() {
  return CATALOGO.filter(p => getQty(p.id) > 0);
}

function updateSummary() {
  const items = selectedItems();
  const n = items.length;
  const sup = new Set(items.map(p => p.fornitore || "—")).size;
  const summary = document.getElementById("summary");
  summary.innerHTML = n
    ? `<b>${n}</b> prodotti · ${sup} fornitor${sup===1?'e':'i'}`
    : `<b>0</b> prodotti da ordinare`;
  document.getElementById("genBtn").disabled = n === 0;
}

/* ---- Generazione ordini per fornitore ---- */
function fmtQty(v) {
  return Number.isInteger(v) ? String(v) : String(v).replace(".", ",");
}

function buildMessages() {
  const items = selectedItems();
  const groups = {};
  items.forEach(p => {
    const f = p.fornitore || "Senza fornitore";
    (groups[f] = groups[f] || []).push(p);
  });
  const oggi = new Date().toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'it')).map(f => {
    const righe = groups[f]
      .sort((a,b)=>a.nome.localeCompare(b.nome,'it'))
      .map(p => `• ${p.nome}: ${fmtQty(getQty(p.id))} ${p.unita}`)
      .join("\n");
    const testo = `${RISTORANTE} — Ordine ${oggi}\n\n${righe}\n\nGrazie!`;
    return { fornitore: f, count: groups[f].length, testo };
  });
}

function apriOrdini() {
  const msgs = buildMessages();
  const box = document.getElementById("orders");
  box.innerHTML = msgs.map((m, i) => `
    <div class="order-card">
      <div class="oc-head">
        <span class="name">${esc(m.fornitore)}</span>
        <span class="n">${m.count} prodott${m.count===1?'o':'i'}</span>
      </div>
      <textarea id="ta-${i}" spellcheck="false">${esc(m.testo)}</textarea>
      <div class="oc-actions">
        <button class="btn-copy" onclick="copia(${i}, this)">Copia</button>
        <button class="btn-wa" onclick="whatsapp(${i})">WhatsApp</button>
      </div>
    </div>`).join("");
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function chiudiOrdini() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") chiudiOrdini();
});

async function copia(i, btn) {
  const ta = document.getElementById("ta-" + i);
  const txt = ta.value;
  try {
    await navigator.clipboard.writeText(txt);
  } catch (e) {
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
  }
  const old = btn.textContent;
  btn.textContent = "Copiato ✓";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1600);
}

function whatsapp(i) {
  const ta = document.getElementById("ta-" + i);
  const url = "https://wa.me/?text=" + encodeURIComponent(ta.value);
  window.open(url, "_blank");
}

function nuovaSerata() {
  if (!selectedItems().length || confirm("Azzerare tutte le quantità e iniziare una nuova serata?")) {
    state.qty = {};
    persist();
    render();
  }
}

/* utils */
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function slug(s) { return s.replace(/[^a-z0-9]+/gi, "-").toLowerCase(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

render();
</script>
