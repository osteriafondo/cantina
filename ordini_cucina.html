<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Ordini Cucina — Osteria Fondo</title>
<link rel="icon" type="image/png" sizes="32x32" href="ordini-favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="carrello.svg" />
<link rel="shortcut icon" href="ordini-favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="ordini-touch-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ordini OF"/>
<meta name="theme-color" content="#1A1714"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E2DDD6;
    --text: #1A1714;
    --muted: #7A756E;
    --hint: #B0AAA2;
    --red: #C0392B;
    --green: #2E7D32;
    --accent: #7B1C2E;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  header {
    background: var(--text);
    color: #F7F5F0;
    padding: 0.85rem 1.1rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .title { display: flex; flex-direction: column; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { font-size: 11px; opacity: 0.55; margin-top: 2px; }
  header button.reset {
    background: transparent; border: 1px solid rgba(247,245,240,0.25);
    color: #F7F5F0; font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm);
    cursor: pointer;
  }
  header button.reset:active { background: rgba(247,245,240,0.1); }

  .toolbar { position: sticky; top: 0; z-index: 90; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-wrap { padding: 10px 1rem 8px; }
  .search-wrap input {
    width: 100%; border: 1px solid var(--border); background: var(--bg);
    border-radius: var(--radius-sm); padding: 11px 12px; font-size: 15px; color: var(--text);
  }
  .search-wrap input:focus { outline: none; border-color: var(--text); background: var(--surface); }

  .segmented { display: flex; gap: 0; margin: 0 1rem 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .segmented button {
    flex: 1; padding: 8px; font-size: 13px; font-weight: 600; border: 0; background: var(--surface);
    color: var(--muted); cursor: pointer;
  }
  .segmented button.on { background: var(--text); color: #F7F5F0; }

  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 1rem;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; z-index: 89;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--text); color: #F7F5F0; border-color: var(--text); }
  .chip .n { opacity: 0.6; margin-left: 4px; }

  main { padding: 0 0 120px; }

  .grp { scroll-margin-top: 150px; }
  .grp-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 1rem 6px; position: sticky; z-index: 50; background: var(--bg);
  }
  .grp-head h2 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
  }
  .grp-head .count { font-size: 11px; color: var(--hint); font-weight: 600; }
  .grp-head .line { flex: 1; height: 1px; background: var(--border); }

  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; margin: 6px 1rem;
  }
  .row.active { border-color: var(--accent); background: #FCF7F3; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .row .meta .sub { color: var(--hint); }
  .row .meta .sub::before { content: "· "; }

  .stepper { display: flex; align-items: center; flex: 0 0 auto; }
  .stepper button {
    width: 34px; height: 38px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper button:active { background: var(--border); }
  .stepper button.minus { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stepper button.plus { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stepper input {
    width: 52px; height: 38px; text-align: center; border: 1px solid var(--border);
    border-left: 0; border-right: 0; font-size: 16px; font-weight: 600; color: var(--text);
    background: var(--surface); -moz-appearance: textfield; padding: 0;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: none; }
  .stepper.filled input { color: var(--accent); }
  .stepper .unit { font-size: 11px; color: var(--muted); align-self: center; padding-left: 8px; min-width: 34px; text-align: left; }

  .empty { text-align: center; color: var(--hint); padding: 40px 1rem; font-size: 14px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 110;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 1rem; padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
  }
  .bar .summary { flex: 1; font-size: 13px; color: var(--muted); }
  .bar .summary b { color: var(--text); font-size: 15px; }
  .bar button.generate {
    background: var(--accent); color: #fff; border: 0; border-radius: var(--radius);
    padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .bar button.generate:disabled { background: var(--border); color: var(--hint); cursor: default; }
  .bar button.generate:active:not(:disabled) { opacity: 0.9; }

  .overlay { position: fixed; inset: 0; z-index: 200; background: rgba(26,23,20,0.45); display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 1rem; background: var(--surface); border-bottom: 1px solid var(--border); }
  .sheet-head h2 { font-size: 16px; font-weight: 700; flex: 1; text-align: center; }
  .sheet-head .back { background: none; border: 0; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 2px; white-space: nowrap; }
  .sheet-head .back:active { opacity: 0.6; }
  .sheet-head .close { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; width: 44px; text-align: right; }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 1rem 20px; }
  .sheet-foot { padding: 12px 1rem; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .sheet-foot .back-full { width: 100%; padding: 13px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600; border-radius: var(--radius); cursor: pointer; }
  .sheet-foot .back-full:active { background: var(--border); }

  .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .order-card .oc-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; background: #FCF7F3; border-bottom: 1px solid var(--border); }
  .order-card .oc-head .name { font-weight: 700; font-size: 14px; color: var(--accent); }
  .order-card .oc-head .n { font-size: 11px; color: var(--muted); }
  .order-card textarea { width: 100%; border: 0; resize: vertical; min-height: 130px; padding: 12px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.55; color: var(--text); background: var(--surface); }
  .order-card textarea:focus { outline: none; }
  .order-card .oc-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .order-card .oc-actions button { flex: 1; padding: 11px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); }
  .btn-copy { background: var(--text); color: #fff; border-color: var(--text) !important; }
  .btn-copy.done { background: var(--green); border-color: var(--green) !important; }
  .btn-wa { background: #25D366; color: #fff; border-color: #25D366 !important; }
  .btn-copy:active, .btn-wa:active { opacity: 0.9; }

  /* azioni header + modalità modifica */
  header .actions { display: flex; gap: 8px; }
  header button.edit { background: transparent; border: 1px solid rgba(247,245,240,0.25); color: #F7F5F0; font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  header button.edit:active { background: rgba(247,245,240,0.1); }
  body.editing header button.edit { background: #F7F5F0; color: var(--text); border-color: #F7F5F0; }

  /* select unità nella riga */
  .stepper .unit-sel { margin-left: 8px; max-width: 96px; font-size: 12px; color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 4px; background: var(--surface); cursor: pointer; }
  .stepper .unit-sel:focus { outline: none; border-color: var(--text); }

  /* pulsante elimina (solo in modifica) */
  .row .del { display: none; width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid #F0C9C4; background: #FDF0EE; color: var(--red); border-radius: var(--radius-sm); font-size: 17px; cursor: pointer; align-items: center; justify-content: center; }
  .row .del:active { background: #F8DEDA; }
  body.editing .row .stepper { display: none; }
  body.editing .row .del { display: flex; }
  body.editing .row { border-style: dashed; }

  /* barra modalità modifica */
  #editbar { display: none; }
  body.editing #bar { display: none; }
  body.editing #editbar { display: flex; }
  #editbar .restore { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #editbar .restore:disabled { opacity: 0.4; cursor: default; }
  #editbar .add { flex: 1; background: var(--accent); color: #fff; border: 0; border-radius: var(--radius); padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #editbar .add:active { opacity: 0.9; }

  /* form nuovo prodotto */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 12px; font-size: 15px; color: var(--text); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--text); background: var(--surface); }
  .sheet-foot .save { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Ordini Cucina</h1>
    <span class="sub">Osteria Fondo</span>
  </div>
  <div class="actions">
    <button class="edit" id="editBtn" onclick="toggleEdit()">Modifica</button>
    <button class="reset" onclick="nuovaSerata()">Nuova serata</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Cerca prodotto…" autocomplete="off"
      oninput="state.q=this.value; render()" />
  </div>
  <div class="segmented">
    <button id="seg-cat" class="on" onclick="setView('categoria')">Per reparto</button>
    <button id="seg-forn" onclick="setView('fornitore')">Per fornitore</button>
  </div>
</div>

<div class="chips" id="chips"></div>

<main id="list"></main>

<div class="bar" id="bar">
  <div class="summary" id="summary"><b>0</b> prodotti da ordinare</div>
  <button class="generate" id="genBtn" onclick="apriOrdini()" disabled>Genera ordini</button>
</div>

<div class="bar" id="editbar">
  <button class="restore" id="restoreBtn" onclick="ripristinaEliminati()">Nessun eliminato</button>
  <button class="add" onclick="apriAggiungi()">＋ Aggiungi prodotto</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <button class="back" onclick="chiudiOrdini()">‹ Lista</button>
      <h2>Ordini da inviare</h2>
      <button class="close" onclick="chiudiOrdini()" aria-label="Chiudi">&times;</button>
    </div>
    <div class="sheet-body" id="orders"></div>
    <div class="sheet-foot">
      <button class="back-full" onclick="chiudiOrdini()">← Torna alla lista prodotti</button>
    </div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <button class="back" onclick="chiudiAggiungi()">Annulla</button>
      <h2>Nuovo prodotto</h2>
      <span style="width:44px"></span>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="add-nome">Nome prodotto</label>
        <input id="add-nome" type="text" placeholder="es. Zucchine chiare" autocomplete="off" />
      </div>
      <div class="field">
        <label for="add-cat">Reparto</label>
        <select id="add-cat"></select>
      </div>
      <div class="field">
        <label for="add-forn">Fornitore</label>
        <select id="add-forn" onchange="onAddFornChange(this)"></select>
      </div>
      <div class="field">
        <label for="add-unit">Unità di misura</label>
        <select id="add-unit" onchange="onAddUnitChange(this)"></select>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="back-full save" onclick="salvaAggiungi()">Aggiungi prodotto</button>
    </div>
  </div>
</div>

  { nome: "Grana grattugiato",          cat: "latticini",        unita: "busta",     fornitore: "MST" },
  { nome: "Squacquerone",               cat: "latticini",        unita: "kg",        fornitore: "MST" },

  // ---------- ARCA ----------

  { nome: "Aceto balsamico",            cat: "generici",         unita: "bottiglia", fornitore: "ARCA" },
  { nome: "Guanti Nitrile M",           cat: "no food",          unita: "confezione",fornitore: "ARCA" },
  { nome: "Guanti Nitrile L",           cat: "no food",          unita: "confezione",fornitore: "ARCA" },
  { nome: "Stracci colorati",           cat: "no food",          unita: "confezione",fornitore: "ARCA" },
  { nome: "Tovagliolini bordeaux",      cat: "no food",          unita: "cartone",   fornitore: "ARCA" },
  { nome: "Buste sottovuoto",           cat: "no food",          unita: "confezione",fornitore: "ARCA" },
  { nome: "Sacchi neri",                cat: "no food",          unita: "cartone",   fornitore: "ARCA" },

const RISTORANTE = "Osteria Fondo";
const STORAGE_KEY = "of_ordini_cucina_v2";

// Unità disponibili nella tendina (l'ultima voce apre l'inserimento libero)
const UNITA = ["pz","cassetta","cartone","g","kg","L","confezione","busta","sacco","mazzo","barattolo","latta","bottiglia"];

/* ============================================================ */

// id stabile per ogni prodotto del catalogo base
(function () {
  const used = {};
  CATALOGO.forEach(p => {
    let base = "s-" + slug(p.nome + "-" + p.fornitore), id = base, k = 2;
    while (used[id]) id = base + "-" + (k++);
    used[id] = 1; p.id = id;
  });
})();

// stato persistito sul dispositivo
const store = { qty: {}, units: {}, removed: [], custom: [] };
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  if (saved && typeof saved === "object") {
    store.qty = saved.qty || {};
    store.units = saved.units || {};
    store.removed = Array.isArray(saved.removed) ? saved.removed : [];
    store.custom = Array.isArray(saved.custom) ? saved.custom : [];
  }
} catch (e) {}

const state = { q: "", view: "categoria", grp: "tutte", edit: false };

// catalogo di lavoro = base (senza eliminati) + prodotti aggiunti dall'utente
let WORK = [];
function rebuild() {
  const rm = new Set(store.removed);
  WORK = CATALOGO.filter(p => !rm.has(p.id)).concat(store.custom);
}
rebuild();

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
}

function unitOf(p) { return store.units[p.id] || p.unita; }
function byId(id) { return WORK.find(p => p.id === id); }

function getQty(id) { return store.qty[id] || 0; }
function setQty(id, val) {
  val = Math.max(0, Math.round(val * 100) / 100);
  if (val === 0) delete store.qty[id]; else store.qty[id] = val;
  persist();
  updateRowVisual(id);
  updateCounts();
  updateSummary();
}
function bump(id, delta) { setQty(id, getQty(id) + delta); }

function groupField() { return state.view === "fornitore" ? "fornitore" : "cat"; }
function groupOrder() { return state.view === "fornitore" ? FORNITORI : CATEGORIE; }
function visibleGroups() {
  const f = groupField();
  const present = [...new Set(WORK.map(p => p[f]))];
  const order = groupOrder().filter(g => present.includes(g));
  const extra = present.filter(g => !groupOrder().includes(g)).sort((a, b) => a.localeCompare(b, "it"));
  return order.concat(extra);
}

function matchesSearch(p) {
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return p.nome.toLowerCase().includes(q) || (p.fornitore || "").toLowerCase().includes(q);
}

function setView(v) {
  if (state.view === v) return;
  state.view = v;
  state.grp = "tutte";
  document.getElementById("seg-cat").classList.toggle("on", v === "categoria");
  document.getElementById("seg-forn").classList.toggle("on", v === "fornitore");
  render();
  window.scrollTo({ top: 0 });
}

function setGrp(g) {
  state.grp = g;
  render();
  if (g !== "tutte") {
    const el = document.getElementById("grp-" + slug(g));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function renderChips() {
  const box = document.getElementById("chips");
  const f = groupField();
  const parts = [`<button class="chip ${state.grp === 'tutte' ? 'on' : ''}" onclick="setGrp('tutte')">Tutte</button>`];
  visibleGroups().forEach(g => {
    const n = WORK.filter(p => p[f] === g && getQty(p.id) > 0).length;
    parts.push(`<button class="chip ${state.grp === g ? 'on' : ''}" onclick="setGrp('${g.replace(/'/g, "\\'")}')">${cap(g)}${n ? `<span class="n">${n}</span>` : ''}</button>`);
  });
  box.innerHTML = parts.join("");
}

function render() {
  const groupsAll = visibleGroups();
  if (state.grp !== "tutte" && !groupsAll.includes(state.grp)) state.grp = "tutte";
  renderChips();
  updateEditBar();
  const list = document.getElementById("list");
  const f = groupField();
  const groups = groupsAll.filter(g => state.grp === "tutte" || state.grp === g);
  let html = "";
  let any = false;

  groups.forEach(g => {
    const prods = WORK.filter(p => p[f] === g && matchesSearch(p));
    if (!prods.length) return;
    any = true;
    const nSel = prods.filter(p => getQty(p.id) > 0).length;
    html += `<section class="grp" id="grp-${slug(g)}" data-group="${esc(g)}">
      <div class="grp-head">
        <h2>${cap(g)}</h2>
        ${nSel ? `<span class="count">${nSel} da ordinare</span>` : ''}
        <span class="line"></span>
      </div>`;
    prods.forEach(p => html += rowHTML(p));
    html += `</section>`;
  });

  list.innerHTML = any ? html : `<div class="empty">Nessun prodotto${state.q ? " trovato" : ""}.</div>`;
  updateSummary();
}

function rowHTML(p) {
  const q = getQty(p.id);
  const sub = state.view === "fornitore" ? cap(p.cat) : p.fornitore;
  return `<div class="row ${q > 0 ? 'active' : ''}" id="row-${p.id}">
    <div class="info">
      <div class="name">${esc(p.nome)}</div>
      <div class="meta">${esc(sub || '—')}</div>
    </div>
    <div class="stepper ${q > 0 ? 'filled' : ''}">
      <button class="minus" onclick="bump('${p.id}',-1)" aria-label="meno">−</button>
      <input type="number" inputmode="decimal" min="0" step="any" value="${q || ''}" placeholder="0"
        onchange="setQty('${p.id}', parseFloat((this.value||'').replace(',','.'))||0)"
        onfocus="this.select()" />
      <button class="plus" onclick="bump('${p.id}',1)" aria-label="più">+</button>
      ${unitSelectHTML(p)}
    </div>
    <button class="del" onclick="removeProduct('${p.id}')" aria-label="Elimina">🗑</button>
  </div>`;
}

function unitSelectHTML(p) {
  const cur = unitOf(p);
  const opts = [];
  if (!UNITA.includes(cur)) opts.push(cur);
  UNITA.forEach(u => { if (opts.indexOf(u) < 0) opts.push(u); });
  const optionsHTML = opts.map(u => `<option value="${esc(u)}" ${u === cur ? 'selected' : ''}>${esc(u)}</option>`).join("")
    + `<option value="__custom__">altro…</option>`;
  return `<select class="unit-sel" id="unit-${p.id}" onchange="onUnitChange('${p.id}', this)">${optionsHTML}</select>`;
}

function onUnitChange(id, sel) {
  const p = byId(id); if (!p) return;
  if (sel.value === "__custom__") {
    const c = prompt("Unità di misura personalizzata:", unitOf(p));
    if (c && c.trim()) setUnit(id, c.trim());
    else sel.value = unitOf(p);
    return;
  }
  setUnit(id, sel.value);
}

function setUnit(id, u) {
  store.units[id] = u;
  persist();
  const row = document.getElementById("row-" + id);
  if (row) {
    const sel = row.querySelector(".unit-sel");
    if (sel) sel.outerHTML = unitSelectHTML(byId(id));
  }
}

function updateRowVisual(id) {
  const row = document.getElementById("row-" + id);
  if (!row) return;
  const q = getQty(id);
  row.classList.toggle("active", q > 0);
  const stepper = row.querySelector(".stepper");
  stepper.classList.toggle("filled", q > 0);
  const input = stepper.querySelector("input");
  if (document.activeElement !== input) input.value = q || "";
}

function updateCounts() {
  renderChips();
  const f = groupField();
  document.querySelectorAll(".grp").forEach(sec => {
    const g = sec.dataset.group;
    const prods = WORK.filter(p => p[f] === g && matchesSearch(p));
    const nSel = prods.filter(p => getQty(p.id) > 0).length;
    let badge = sec.querySelector(".grp-head .count");
    if (nSel) {
      if (!badge) {
        sec.querySelector(".grp-head h2").insertAdjacentHTML("afterend", `<span class="count"></span>`);
        badge = sec.querySelector(".grp-head .count");
      }
      badge.textContent = `${nSel} da ordinare`;
    } else if (badge) {
      badge.remove();
    }
  });
}

function selectedItems() { return WORK.filter(p => getQty(p.id) > 0); }

function updateSummary() {
  const items = selectedItems();
  const n = items.length;
  const sup = new Set(items.map(p => p.fornitore || "—")).size;
  const summary = document.getElementById("summary");
  summary.innerHTML = n
    ? `<b>${n}</b> prodotti · ${sup} fornitor${sup === 1 ? 'e' : 'i'}`
    : `<b>0</b> prodotti da ordinare`;
  document.getElementById("genBtn").disabled = n === 0;
}

function fmtQty(v) { return Number.isInteger(v) ? String(v) : String(v).replace(".", ","); }

function buildMessages() {
  const items = selectedItems();
  const groups = {};
  items.forEach(p => { const f = p.fornitore || "Senza fornitore"; (groups[f] = groups[f] || []).push(p); });
  const ordered = Object.keys(groups).sort((a, b) => {
    const ia = FORNITORI.indexOf(a), ib = FORNITORI.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b, "it");
  });
  return ordered.map(f => {
    const testo = groups[f]
      .sort((a, b) => a.nome.localeCompare(b.nome, "it"))
      .map(p => `${p.nome}: ${fmtQty(getQty(p.id))} ${unitOf(p)}`)
      .join("\n");
    return { fornitore: f, count: groups[f].length, testo };
  });
}

function apriOrdini() {
  const msgs = buildMessages();
  const box = document.getElementById("orders");
  box.innerHTML = msgs.map((m, i) => `
    <div class="order-card">
      <div class="oc-head">
        <span class="name">${esc(m.fornitore)}</span>
        <span class="n">${m.count} prodott${m.count === 1 ? 'o' : 'i'}</span>
      </div>
      <textarea id="ta-${i}" spellcheck="false">${esc(m.testo)}</textarea>
      <div class="oc-actions">
        <button class="btn-copy" onclick="copia(${i}, this)">Copia</button>
        <button class="btn-wa" onclick="whatsapp(${i})">WhatsApp</button>
      </div>
    </div>`).join("");
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function chiudiOrdini() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") chiudiOrdini(); });
document.getElementById("addOverlay").addEventListener("click", e => { if (e.target.id === "addOverlay") chiudiAggiungi(); });

async function copia(i, btn) {
  const ta = document.getElementById("ta-" + i);
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.focus(); ta.select(); try { document.execCommand("copy"); } catch (e2) {} }
  const old = btn.textContent;
  btn.textContent = "Copiato ✓"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1600);
}

function whatsapp(i) {
  const ta = document.getElementById("ta-" + i);
  window.open("https://wa.me/?text=" + encodeURIComponent(ta.value), "_blank");
}

function nuovaSerata() {
  if (!selectedItems().length || confirm("Azzerare tutte le quantità e iniziare una nuova serata?")) {
    store.qty = {}; persist(); render();
  }
}

/* ---------- Modalità modifica: aggiungi / elimina prodotti ---------- */
function toggleEdit() {
  state.edit = !state.edit;
  document.body.classList.toggle("editing", state.edit);
  document.getElementById("editBtn").textContent = state.edit ? "Fine" : "Modifica";
  updateEditBar();
}

function updateEditBar() {
  const btn = document.getElementById("restoreBtn");
  if (!btn) return;
  const n = store.removed.length;
  btn.textContent = n ? `Ripristina eliminati (${n})` : "Nessun eliminato";
  btn.disabled = n === 0;
}

function removeProduct(id) {
  const p = byId(id); if (!p) return;
  if (!confirm(`Eliminare "${p.nome}" dalla lista?`)) return;
  if (String(id).startsWith("c-")) store.custom = store.custom.filter(x => x.id !== id);
  else if (!store.removed.includes(id)) store.removed.push(id);
  delete store.qty[id];
  delete store.units[id];
  persist(); rebuild(); render();
}

function ripristinaEliminati() {
  if (!store.removed.length) return;
  if (confirm(`Ripristinare ${store.removed.length} prodotti eliminati?`)) {
    store.removed = []; persist(); rebuild(); render();
  }
}

function fornitoriEsistenti() {
  const set = new Set(FORNITORI);
  WORK.forEach(p => { if (p.fornitore) set.add(p.fornitore); });
  return [...set];
}
function categorieEsistenti() {
  const set = new Set(CATEGORIE);
  WORK.forEach(p => { if (p.cat) set.add(p.cat); });
  return [...set];
}
function fillSelect(sel, values, current) {
  sel.innerHTML = values.map(v => `<option value="${esc(v)}" ${v === current ? 'selected' : ''}>${esc(cap(v))}</option>`).join("");
}

function apriAggiungi() {
  document.getElementById("add-nome").value = "";
  fillSelect(document.getElementById("add-cat"), categorieEsistenti(),
    (state.view === "categoria" && state.grp !== "tutte") ? state.grp : CATEGORIE[0]);
  const fornSel = document.getElementById("add-forn");
  fillSelect(fornSel, fornitoriEsistenti(),
    (state.view === "fornitore" && state.grp !== "tutte") ? state.grp : FORNITORI[0]);
  fornSel.innerHTML += `<option value="__new__">＋ Nuovo fornitore…</option>`;
  document.getElementById("add-unit").innerHTML =
    UNITA.map(u => `<option value="${esc(u)}" ${u === 'pz' ? 'selected' : ''}>${esc(u)}</option>`).join("")
    + `<option value="__custom__">altro…</option>`;
  document.getElementById("addOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => document.getElementById("add-nome").focus(), 60);
}

function chiudiAggiungi() {
  document.getElementById("addOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function onAddFornChange(sel) {
  if (sel.value !== "__new__") return;
  const c = prompt("Nome del nuovo fornitore:");
  if (c && c.trim()) {
    const opt = document.createElement("option");
    opt.value = c.trim(); opt.textContent = c.trim(); opt.selected = true;
    sel.insertBefore(opt, sel.lastElementChild);
  } else sel.selectedIndex = 0;
}
function onAddUnitChange(sel) {
  if (sel.value !== "__custom__") return;
  const c = prompt("Unità di misura personalizzata:");
  if (c && c.trim()) {
    const opt = document.createElement("option");
    opt.value = c.trim(); opt.textContent = c.trim(); opt.selected = true;
    sel.insertBefore(opt, sel.lastElementChild);
  } else sel.selectedIndex = 0;
}

function salvaAggiungi() {
  const nome = document.getElementById("add-nome").value.trim();
  if (!nome) { alert("Scrivi il nome del prodotto."); return; }
  const cat = document.getElementById("add-cat").value;
  let forn = document.getElementById("add-forn").value;
  let unita = document.getElementById("add-unit").value;
  if (forn === "__new__") forn = FORNITORI[0];
  if (unita === "__custom__") unita = "pz";
  const id = "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  store.custom.push({ id, nome, cat, unita, fornitore: forn });
  persist(); rebuild();
  chiudiAggiungi();
  setGrp(state.view === "fornitore" ? forn : cat);
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function slug(s) { return s.replace(/[^a-z0-9]+/gi, "-").toLowerCase(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }

render();
</script>
