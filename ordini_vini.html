<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Ordini Vini — Osteria Fondo</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Ordini vini OF"/>
<meta name="theme-color" content="#7B1C2E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>
/* Stessa palette del gestionale cantina (inventario_vini). Layout: barra in alto con le sezioni;
   nell'ordine il listino a sinistra e i totali a destra (barra in basso sul telefono). */
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #FAF8F4;
  --ink: #1A1714;
  --muted: #7A756E;
  --line: #E2DDD6;
  --accent: #7B1C2E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FCEFF0;
  --ok: #2E7D32;
  --warn: #9C6A00;
  --danger: #C0392B;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
h2 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 24px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button { background: none; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button:hover { color: var(--ink); background: var(--surface-2); }
.tabs button.on { color: var(--ink); background: var(--accent-soft); }

main { padding-block: 24px 96px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sub { color: var(--muted); margin-top: 4px; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.crumbs { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 28px; }
.save { font-size: 0.8rem; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 6px 10px; font-size: 0.85rem; }
.btn.wide { width: 100%; padding-block: 12px; font-size: 1rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
.link:hover { text-decoration: underline; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.banner { border: 1px solid var(--warn); color: var(--warn); background: var(--surface); padding: 12px 14px; border-radius: var(--r); margin-bottom: 18px; }
.empty { color: var(--muted); padding: 28px 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-size: 1.05rem; }
.empty .btns { justify-content: center; margin-top: 14px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.draft { color: var(--warn); }
.chip.sent { color: var(--ok); }
.chip.plain { color: var(--muted); }
.chip.plain::before { display: none; }

/* Orders list */
.section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 26px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.olist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.orow { display: grid; grid-template-columns: minmax(0, 2.2fr) 0.7fr 1fr 1fr 1fr 24px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.orow:first-child { border-top: 0; }
.orow:hover { background: var(--surface-2); }
.orow .who { color: var(--muted); font-size: 0.82rem; }
.orow .k { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.orow .arrow { color: var(--muted); }
.ohead { cursor: default; background: var(--surface-2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-block: 8px; }
.ohead:hover { background: var(--surface-2); }
.oname { font-weight: 600; }
@media (max-width: 720px) {
  .orow { grid-template-columns: 1fr auto; }
  .orow .hide-s, .ohead { display: none; }
}

/* Supplier cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.pick { cursor: pointer; text-align: left; }
.card.pick:hover { border-color: var(--accent); }
.card .t { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.card h2 { font-size: 1.1rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card .btns { margin-top: auto; padding-top: 4px; }

/* Order editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.plist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tools { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); background: var(--surface); z-index: 2; border-radius: var(--r) var(--r) 0 0; }
.tools input[type="search"] { flex: 1 1 240px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); font-size: 1rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--surface); }
.phead, .prow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 172px 100px; gap: 12px; align-items: center; padding: 10px 14px; }
.phead { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); padding-block: 8px; }
.phead span:nth-child(n+2), .pprice, .psub { text-align: right; }
.phead span:nth-child(3) { text-align: center; }
.prow { border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow.sel { background: var(--accent-soft); }
.pname { font-weight: 600; }
.vint { font-family: var(--font-num); font-weight: 500; font-size: 0.88em; color: var(--accent); }
.pmeta { color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.gone { color: var(--warn); }
.pprice { font-size: 0.9rem; }
.psub { font-size: 0.9rem; font-weight: 500; }
.qty { display: flex; align-items: center; justify-content: center; gap: 4px; }
.qty button { width: 32px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 1.05rem; line-height: 1; }
.qty button:hover { border-color: var(--muted); }
.qty button.case { width: auto; padding: 0 7px; font-size: 0.78rem; font-family: var(--font-num); color: var(--muted); }
.qty input { width: 48px; height: 34px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--font-num); font-size: 0.95rem; }
.prow.sel .qty input { border-color: var(--accent); font-weight: 600; }
@media (max-width: 640px) {
  .phead { display: none; }
  .prow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "info info" "price qty"; row-gap: 8px; }
  .pinfo { grid-area: info; }
  .pprice { grid-area: price; text-align: left; }
  .qty { grid-area: qty; }
  .psub { display: none; }
}

.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.figs { display: grid; gap: 10px; }
.fig { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fig span { color: var(--muted); font-size: 0.88rem; }
.fig strong { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 500; }
.fig.gross strong { font-size: 1.25rem; font-weight: 600; }
.avg { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.avg .l { font-size: 0.88rem; color: var(--muted); }
.avg .l b { display: block; color: var(--ink); font-size: 0.95rem; }
.avg strong { font-family: var(--font-num); font-size: 1.9rem; font-weight: 500; color: var(--accent); line-height: 1; letter-spacing: -0.03em; }
.mini { display: flex; gap: 16px; font-size: 0.82rem; color: var(--muted); }
.mini b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }
.meter { display: grid; gap: 5px; font-size: 0.82rem; }
.meter .bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--warn); }
.meter.ok .bar i { background: var(--ok); }
.meter.ok .txt { color: var(--ok); }
.meter .txt { color: var(--warn); }
.rep { font-size: 0.88rem; display: grid; gap: 2px; }
.rep .n { font-weight: 600; }
.rep .c { color: var(--muted); user-select: all; }
.conds { font-size: 0.84rem; color: var(--muted); display: grid; gap: 3px; white-space: pre-line; }
.conds b { color: var(--ink); font-weight: 500; }
label.f { display: grid; gap: 5px; font-size: 0.82rem; color: var(--muted); font-weight: 500; }
label.f input, label.f select, label.f textarea, textarea.f { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); color: var(--ink); font-size: 0.95rem; font-weight: 400; }
textarea { resize: vertical; }

@media (max-width: 960px) {
  .editor { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
}
.mbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: none; align-items: center; gap: 12px; }
.mbar .m { flex: 1; min-width: 0; display: grid; font-size: 0.8rem; color: var(--muted); }
.mbar .m b { color: var(--ink); font-family: var(--font-num); font-size: 1rem; font-weight: 500; }
@media (max-width: 960px) { body.editing .mbar { display: flex; } }

/* Sent view */
.sent { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .sent { grid-template-columns: minmax(0, 1fr); } }
.msg { width: 100%; min-height: 320px; font-family: var(--font-num); font-size: 0.86rem; line-height: 1.55; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
table.lines { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.lines th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.lines td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.lines .r { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Supplier editor */
.sform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
@media (max-width: 900px) { .sform { grid-template-columns: minmax(0, 1fr); } }
.sform .panel h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.listino-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.listino-head .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
.listino-head input[type="date"] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); }
table.ptable { width: 100%; border-collapse: collapse; min-width: 860px; }
table.ptable th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
table.ptable td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.ptable input { width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 5px; background: none; font-size: 0.9rem; }
table.ptable input:hover { border-color: var(--line); }
table.ptable input:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }
table.ptable input.n { font-family: var(--font-num); text-align: right; }
table.ptable .x { width: 34px; text-align: center; }
table.ptable .x button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; width: 28px; height: 28px; border-radius: 5px; }
table.ptable .x button:hover { color: var(--danger); background: var(--surface-2); }
.imp { padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 10px; }
.imp p { font-size: 0.86rem; color: var(--muted); }
.imp code { font-family: var(--font-num); font-size: 0.82rem; color: var(--ink); }
.imp textarea { min-height: 140px; font-family: var(--font-num); font-size: 0.82rem; background: var(--surface); }
.imp .src { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.imp .src strong { font-size: 0.95rem; }
.impbusy { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.impbusy span:nth-child(2) { flex: 1; font-size: 0.9rem; }
.impnote { font-size: 0.88rem; color: var(--ink) !important; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 6px 6px 0; }
.impnote.warn { border-left-color: var(--warn); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 0.8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.prev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.prev table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 620px; }
.prev th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.prev td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.prev td.r { text-align: right; font-family: var(--font-num); white-space: nowrap; }
.prev .more { padding: 6px 8px; color: var(--muted); font-size: 0.8rem; }
.drop-on .plist { outline: 2px dashed var(--accent); outline-offset: 4px; }
details.raw summary { cursor: pointer; font-size: 0.86rem; color: var(--muted); }
details.raw[open] summary { margin-bottom: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--r); font-size: 0.9rem; max-width: calc(100% - 32px); }
body.editing .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.muted { color: var(--muted); }
.login { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.login[hidden] { display: none; }
.login-card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
.login-card input { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r); font-size: 1rem; background: var(--surface-2); }
.login-err { color: var(--danger); font-size: 0.88rem; }
@media (prefers-reduced-motion: no-preference) {
  .prow { transition: background-color 0.15s; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h10l-.6 6.2A4.4 4.4 0 0 1 12 13.2a4.4 4.4 0 0 1-4.4-4L7 3Z"/><path d="M12 13.2V20M8.5 21h7"/><path d="M7.5 7.5h9" stroke-width="1.4"/></svg>
      Ordini vini
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-act="go" data-v="orders">Ordini</button>
      <button type="button" data-act="go" data-v="suppliers">Fornitori</button>
      <button type="button" data-act="go" data-v="settings">Impostazioni</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="mbar" id="mbar"></div>
<div class="toast" id="toast" hidden></div>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <h2>Ordini vini</h2>
    <p class="muted">Usa la stessa password del gestionale cantina.</p>
    <input type="password" id="loginPw" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <p class="login-err" id="loginErr" hidden></p>
    <button type="submit" class="btn primary wide" id="loginBtn">Entra</button>
  </form>
</div>
<input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>

<script>
const IVA = 0.22;
const $ = s => document.querySelector(s);
const main = $('#main');
const eur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
const fmt = v => eur.format(v || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const parseNum = s => {
  if (typeof s === 'number') return s;
  s = String(s ?? '').replace(/[€\s]/g, '');

/* ---------- backend ---------- */
async function backendFetch(opts, tentativi = 3, timeout = 30000) {
  let ultimo;
  for (let i = 0; i < tentativi; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(BACKEND_URL, { ...opts, signal: opts.signal || ctrl.signal, redirect: 'follow' });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const testo = await res.text();
      try { return JSON.parse(testo); } catch { throw new Error('Risposta non valida dal backend'); }
    } catch (e) {
      clearTimeout(timer);
      ultimo = e;
      if (opts.signal?.aborted) throw { code: 'cancelled' };
      if (i < tentativi - 1) await new Promise(r => setTimeout(r, 800 * Math.pow(2, i)));
    }
  }
  throw ultimo;
}
class ApiError extends Error {}
// Chiamata al backend: errori di password riaprono il login, gli altri diventano ApiError
async function api(action, dati, extra = {}, opts = {}) {
  const body = new URLSearchParams({ action, token: getToken(), ...(dati !== undefined ? { dati: JSON.stringify(dati) } : {}), ...extra });
  const r = await backendFetch({ method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString(), signal: opts.signal }, opts.tentativi, opts.timeout);
  if (r && r.errore) {
    if (/autorizz/i.test(r.errore)) { showLogin(); throw new ApiError('Password non valida: rientra.'); }
    throw new ApiError(r.errore);
  }
  return r;
}

  const lines = Object.values(o.lines || {}).filter(l => l.qty > 0)
    .sort((a, b) => (a.producer || '').localeCompare(b.producer || '', 'it') || (a.name || '').localeCompare(b.name || '', 'it'));
  const t = totals(o.lines);
  const out = [];
  out.push(first ? `Ciao ${first},` : 'Buongiorno,');
  out.push(`${first ? 'ti' : 'vi'} mando l'ordine${st.venueName ? ' per ' + st.venueName : ''}:`);
  out.push('');
  for (const l of lines) {
    let s = `- ${l.qty} bt  ${l.name}${l.vintage ? ' ' + l.vintage : ''}`;
    const extra = [l.producer, l.format].filter(Boolean).join(', ');
    if (extra) s += ` (${extra})`;
    if (l.code) s += ` [cod. ${l.code}]`;
    if (withPrices) s += ` a ${fmt(l.price)}/bt`;
    out.push(s);
  }
  out.push('');
  out.push(`Totale: ${t.b} bottiglie${withPrices ? ', ' + fmt(t.net) + ' + IVA' : ''}`);
  if (o.note?.trim()) { out.push(''); out.push(o.note.trim()); }
  out.push('');
  out.push(st.signature?.trim() || `Mi confermi disponibilità e data di consegna?\nGrazie!`);
  return out.join('\n');
}

async function pdfToLines(pdf) {
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 8;
      let r = rows.find(r => Math.abs(r.y - y) < Math.max(r.h, h) * 0.5);
      if (!r) { r = { y, h, items: [] }; rows.push(r); }
      r.items.push({ x, w: it.width || 0, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    pages.push(rows.map(r => {
      r.items.sort((a, b) => a.x - b.x);
      let out = '', end = null;
      for (const i of r.items) {
        if (end !== null) { const gap = i.x - end; out += gap > r.h * 1.2 ? '\t' : gap > r.h * 0.12 ? ' ' : ''; }

}

  } catch (e) {
    warn = true;
    if (e?.code === 'cancelled') note = acc.length ? `Import interrotto: tengo le ${acc.length} referenze lette finora.` : 'Import interrotto.';
    else {
      // riserva: estraggo il testo nel browser e uso il metodo semplice
      try {
        impStatus('Lettura con Claude non riuscita, provo il metodo semplice…');
        const lib = await getPdfJs();
        const pdf = await lib.getDocument({ data: bytes.slice(), isEvalSupported: false, useSystemFonts: true }).promise;
        const h = heuristicRows((await pdfToLines(pdf)).flat());
        acc.push(...h);
        note = `La lettura con Claude non è riuscita (${e?.message || 'errore sconosciuto'}): ho estratto ${h.length} righe con un metodo semplice. Produttori e colonne possono essere sbagliati, controllali con attenzione.`;
      } catch (e2) {
        note = e2?.name === 'PasswordException' ? 'Il PDF è protetto da password: chiedi al fornitore una copia senza protezione.'
          : e2?.name === 'InvalidPDFException' ? 'Il file non sembra un PDF valido.'
          : `Non sono riuscito a leggere il PDF (${e?.message || 'errore sconosciuto'}).`;
      }
    }
  }
  if (!S.imp || S.imp.ctl !== ctl) return;
  S.imp = { text: acc.length ? rowsToTSV(acc) : '', busy: false, status: note, warn: warn || !acc.length, src: file.name };
  if (S.view === 'supplier') render();
}
const prodKey = p => p.code ? 'c:' + norm(p.code) : 'n:' + norm([p.name, p.producer, p.vintage, p.format].join('|'));
function readProducts() {
  return S.sdraft.products.map(p => ({ id: p.id || rid(), code: String(p.code || '').trim(), name: String(p.name || '').trim(), producer: String(p.producer || '').trim(), vintage: String(p.vintage || '').trim(), format: String(p.format || '').trim(), price: Math.round(parseNum(p.price) * 100) / 100, case: parseInt(p.case) || 0 })).filter(p => p.name);
}
async function saveSupplier() {
  const s = S.sdraft;
  if (!String(s.name || '').trim()) { toast('Serve almeno il nome del fornitore.'); $('#f-name')?.focus(); return; }
  const body = { ...clone(s), name: s.name.trim(), minOrder: parseNum(s.minOrder) || 0, freeShipping: parseNum(s.freeShipping) || 0, products: readProducts() };
  const btn = $('[data-act="save-supplier"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvataggio…'; }
  try {
    const r = await api('ordiniSalvaFornitore', body, {}, { tentativi: 1, timeout: 120000 });
    body.updatedAt = r.updatedAt;
    const i = S.suppliers.findIndex(x => x.id === body.id);
    if (i >= 0) S.suppliers[i] = body; else S.suppliers.push(body);
    S.suppliers.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'it'));
    S.sdraft = clone(body);
    S.sdirty = false; S.leaveArmed = null;
    toast('Fornitore salvato');
    render();
  } catch (e) {
    toast(e instanceof ApiError ? e.message : 'Salvataggio non riuscito: controlla la connessione e riprova.');
    if (btn?.isConnected) { btn.disabled = false; btn.textContent = 'Salva fornitore'; }
  }
}
function markDirty() { S.sdirty = true; S.leaveArmed = null; const el = $('#sdirty'); if (el) el.textContent = 'Modifiche non salvate'; }

/* ---------- settings ---------- */
function renderSettings() {
  const st = S.settings || {};
  return `<section class="head"><div><h1>Impostazioni</h1><p class="sub">Come firmiamo i messaggi d'ordine ai fornitori.</p></div>
    <button type="button" class="btn primary" data-act="save-settings">Salva impostazioni</button></section>
  <div class="panel" style="max-width:640px">
    <label class="f">Nome del locale<input id="s-venueName" data-st="venueName" value="${esc(st.venueName || '')}" placeholder="Es. Osteria del Ponte"></label>
    <label class="f">Chiusura del messaggio<textarea id="s-signature" data-st="signature" rows="4" placeholder="Mi confermi disponibilità e data di consegna?&#10;Grazie!">${esc(st.signature || '')}</textarea></label>
    <label class="check"><input type="checkbox" id="s-defaultWithPrices" data-st="defaultWithPrices" ${st.defaultWithPrices ? 'checked' : ''}> Includi i prezzi nel messaggio per impostazione predefinita</label>
  </div>
  <div class="btns" style="margin-top:20px"><button type="button" class="btn ghost" data-act="logout">Esci da questo dispositivo</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'go': go(el.dataset.v); break;
    case 'reload': S.status = 'loading'; render(); load(); break;
    case 'logout': showLogin(); break;
    case 'pick-supplier': if (S.view === 'supplier' && S.sdirty) { toast('Salva prima le modifiche al fornitore.'); break; } newOrder(el.dataset.id); break;
    case 'open-order': openOrder(el.dataset.id); break;
    case 'dq': {
      const pid = el.closest('.prow').dataset.pid;
      setQty(pid, (S.draft.lines[pid]?.qty || 0) + (+el.dataset.d));
      break;
    }
    case 'flt':
      S.onlySel = el.dataset.v === 'sel';
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      applyFilter(); break;
    case 'finish': finishOrder(); break;
    case 'del-order':
      if (!armed(el, 'del')) break;
      clearTimeout(saveTimer); saveTimer = null;
      try {
        await api('ordiniEliminaOrdine', { id: S.draft.id });
        S.orders = S.orders.filter(o => o.id !== S.draft.id);
        S.draft = null; toast('Bozza eliminata'); go('orders');
      } catch (e) { toast(e instanceof ApiError ? e.message : 'Eliminazione non riuscita, riprova.'); }
      break;
    case 'reopen': S.draft.status = 'bozza'; delete S.draft.closedAt; render(); await flush(); break;
    case 'duplicate': {
      const sup = supplierOf(S.draft);
      const lines = {};
      for (const [pid, l] of Object.entries(S.draft.lines)) {
        const p = sup?.products?.find(x => x.id === pid);
        lines[pid] = p ? { ...snapProd(p), qty: l.qty } : { ...l };
      }
      newOrder(S.draft.supplierId, lines); toast('Nuova bozza creata dall\'ordine'); break;
    }
    case 'copy-msg': {
      const ta = $('#msg');
      try { await navigator.clipboard.writeText(ta.value); toast('Messaggio copiato'); }
      catch { ta.focus(); ta.select(); toast('Testo selezionato: copialo con ⌘C o Ctrl+C'); }
      break;
    }
    case 'new-supplier': editSupplier(null); break;
    case 'edit-supplier': if (S.view === 'order') flushNow(); editSupplier(el.dataset.id); break;
    case 'save-supplier': saveSupplier(); break;
    case 'del-supplier':
      if (!armed(el, 'dels')) break;
      try {
        await api('ordiniEliminaFornitore', { id: S.sdraft.id });
        S.suppliers = S.suppliers.filter(x => x.id !== S.sdraft.id);
        toast('Fornitore eliminato'); S.sdirty = false; go('suppliers');
      }
      catch (e) { toast(e instanceof ApiError ? e.message : 'Eliminazione non riuscita, riprova.'); }
      break;
    case 'add-prod': S.sdraft.products.push(blankProd()); markDirty(); render(); { const ins = document.querySelectorAll('input[data-pf="name"]'); ins[ins.length - 1]?.focus(); } break;
    case 'rm-prod': S.sdraft.products.splice(+el.dataset.i, 1); markDirty(); render(); break;
    case 'imp-open': if (S.imp?.busy) break; S.imp = { text: '' }; render(); $('#impText')?.focus(); break;
    case 'pdf-open': if (S.imp?.busy) break; { const f = $('#pdfFile'); f.value = ''; f.click(); } break;
    case 'imp-stop': S.imp?.ctl?.abort(); break;
    case 'imp-cancel': S.imp?.ctl?.abort(); S.imp = null; render(); break;
    case 'imp-replace':
    case 'imp-merge': {
      // la stessa referenza ripetuta (es. a cavallo tra due pagine) entra una volta sola
      const list = [...new Map(parseImport(S.imp?.text).map(p => [prodKey(p), p])).values()];
      if (!list.length) { toast('Nessuna riga riconosciuta: controlla che ci sia almeno la colonna del vino.'); break; }
      if (act === 'imp-replace' && S.sdraft.products.length && !armed(el, 'rep')) break;
      const old = new Map(S.sdraft.products.map(p => [prodKey(p), p]));
      if (act === 'imp-replace') {
        S.sdraft.products = list.map(p => ({ ...p, id: old.get(prodKey(p))?.id || p.id }));
      } else {
        let added = 0;
        for (const p of list) {
          const o = old.get(prodKey(p));
          if (o) Object.assign(o, { ...p, id: o.id }); else { S.sdraft.products.push(p); added++; }
        }
      }
      S.sdraft.priceListDate = todayISO();
      S.imp = null; markDirty(); render();
      toast(`${list.length} referenze importate. Ricorda di salvare.`);
      break;
    }
    case 'save-settings': {
      const body = { venueName: $('#s-venueName').value.trim(), signature: $('#s-signature').value, defaultWithPrices: $('#s-defaultWithPrices').checked };
      try { await api('ordiniSalvaImpostazioni', body); S.settings = body; S.setDirty = false; toast('Impostazioni salvate'); }
      catch (e) { toast(e instanceof ApiError ? e.message : 'Salvataggio non riuscito, riprova.'); }
      break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; applyFilter(); return; }
  if (t.classList.contains('qin')) { setQty(t.closest('.prow').dataset.pid, parseInt(t.value.replace(/\D/g, '')) || 0); return; }
  if (t.id === 'onote') { S.draft.note = t.value; scheduleSave(); return; }
  if (t.dataset.sf) {
    S.sdraft[t.dataset.sf] = t.value; markDirty();
    if (t.dataset.sf === 'name') { const h = main.querySelector('h1'); if (h) h.textContent = t.value || 'Senza nome'; }
    return;
  }
  if (t.dataset.pf) { S.sdraft.products[+t.dataset.pi][t.dataset.pf] = t.value; markDirty(); return; }
  if (t.id === 'impText') { S.imp.text = t.value; refreshImp(); return; }
  if (t.dataset.st) { S.setDirty = true; S.leaveArmed = null; return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'withPrices') { S.withPrices = t.checked; refreshMsg(); }
  if (t.id === 'pdfFile') importPdf(t.files?.[0]);
  if (t.dataset.st) S.setDirty = true;
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList?.contains('qin')) {
    const pid = t.closest('.prow').dataset.pid;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const q = (S.draft.lines[pid]?.qty || 0) + (e.key === 'ArrowUp' ? 1 : -1);
      setQty(pid, q); t.value = Math.max(0, q) || '';
    }
    if (e.key === 'Enter') { t.blur(); $('#q')?.focus(); $('#q')?.select(); }
  }
});
document.addEventListener('focusout', e => { if (e.target.classList?.contains('qin')) { const l = S.draft?.lines[e.target.closest('.prow').dataset.pid]; e.target.value = l?.qty || ''; } });
window.addEventListener('beforeunload', () => flushNow());
// drop a PDF anywhere on a supplier page to import it
document.addEventListener('dragover', e => {
  if (S.view !== 'supplier' || !e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault(); document.body.classList.add('drop-on');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop-on'); });
document.addEventListener('drop', e => {
  document.body.classList.remove('drop-on');
  if (S.view !== 'supplier') return;
  e.preventDefault();
  importPdf(e.dataTransfer?.files?.[0]);
});

/* ---------- dati dal Google Sheet ---------- */
let lastLoad = 0, loadingNow = null;
function applyData(r) {
  S.suppliers = (r.fornitori || []).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'it'));
  S.orders = r.ordini || [];
  S.settings = r.impostazioni || {};
  S.status = 'ok';
  const v = S.view;
  if (v === 'orders' || v === 'pick' || v === 'suppliers') return render();
  if (v === 'order' && S.draft) {
    // un altro dispositivo ha modificato questo ordine: lo ricarico se qui non ci sono modifiche in sospeso
    const r2 = S.orders.find(o => o.id === S.draft.id);
    if (r2 && (r2.updatedAt || 0) > (S.draft.updatedAt || 0) + 1000 && !saveTimer && !saving) {
      S.draft = clone(r2); S.draft.lines = S.draft.lines || {}; render();
    }
    return;
  }
  if (v === 'settings' && !S.setDirty) render();
}
async function load() {
  if (loadingNow) return loadingNow;
  loadingNow = (async () => {
    try {
      applyData(await api('ordiniLeggi'));
      lastLoad = Date.now();
    } catch (e) {
      if (e instanceof ApiError) { if (!/password/i.test(e.message)) toast(e.message); }
      else if (!S.suppliers.length && !S.orders.length) { S.status = 'offline'; render(); }
      else toast('Aggiornamento non riuscito: controlla la connessione.');
    } finally { loadingNow = null; }
  })();
  return loadingNow;
}
function refreshSoon() {
  if (getToken() && Date.now() - lastLoad > 20000 && S.view !== 'supplier') load();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshSoon(); });
setInterval(() => { if (document.visibilityState === 'visible' && ['orders', 'pick', 'suppliers'].includes(S.view)) refreshSoon(); }, 60000);

/* ---------- accesso ---------- */
function showLogin() {
  try { localStorage.removeItem(TOKEN_KEY); } catch {}
  $('#login').hidden = false;
  $('#loginPw').focus();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#loginPw').value.trim();
  const err = $('#loginErr'), btn = $('#loginBtn');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Verifica…'; err.hidden = true;
  try {
    const r = await backendFetch({ method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ action: 'verificaToken', token: pw }).toString() });
    if (r && r.ok) {
      try { localStorage.setItem(TOKEN_KEY, pw); } catch {}
      $('#login').hidden = true; $('#loginPw').value = '';
      S.status = 'loading'; render(); load();
    } else { err.textContent = 'Password errata'; err.hidden = false; }
  } catch { err.textContent = 'Errore di connessione, riprova'; err.hidden = false; }
  btn.disabled = false; btn.textContent = 'Entra';
});

function boot() {
  render();
  if (!getToken()) { showLogin(); return; }
  load();
}
boot();
</script>
</body>
